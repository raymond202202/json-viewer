name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # —— CI checks: run on every push/PR ——
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 deps
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake g++
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)

  # —— Release: triggered by git tag v* ——
  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 deps
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake g++
      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Package
        run: |
          mkdir -p dist
          cp build/json-viewer-qt dist/
          cp resources/icon.png dist/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # —— Release: Windows 构建（tag 触发，报告建议：让 Windows 用户免装环境直接拿二进制）——
  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 (aqtinstall)
        shell: bash
        run: |
          pip install aqtinstall
          aqt install-qt --timeout 60 windows desktop 6.7.3 win64_msvc2019_64 -O "$RUNNER_TEMP/Qt"
      - name: Configure & Build (MSVC)
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.7.3/msvc2019_64"
          cmake --build build --config Release -j2
      - name: Package with windeployqt
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/Qt/6.7.3/msvc2019_64/bin:$PATH"
          mkdir -p dist
          cp build/Release/json-viewer-qt.exe dist/
          cd dist
          windeployqt json-viewer-qt.exe --release --no-translations
          cd ..
          powershell -Command "Compress-Archive -Path dist/* -DestinationPath json-viewer-qt-win-x64.zip"
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: json-viewer-qt-win-x64.zip
